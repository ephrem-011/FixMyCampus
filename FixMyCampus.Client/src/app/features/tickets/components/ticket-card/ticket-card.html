<article class="ticket-card">
  <div class="ticket-topline">
    <span class="ticket-label">{{ ticket.category }}</span>
    <span class="status-badge" [ngClass]="statusClass">{{ ticket.status }}</span>
  </div>

  <h3>{{ ticket.title }}</h3>
  <p class="ticket-meta">{{ ticket.buildingName }} • {{ ticket.room }}</p>
  <p class="ticket-description">{{ ticket.description }}</p>

  <div class="ticket-footer">
    <span>{{ ticket.priority }} priority</span>
    <a [routerLink]="['/tickets', ticket.id]">View details</a>
  </div>
</article>
