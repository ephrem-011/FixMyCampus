
<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">F</div>

    <div class="brand-text">
      <h2>FixMyCampus</h2>
      <span>Campus Care Portal</span>
    </div>
  </div>

  <div class="workspace-label">WORKSPACE</div>

  <nav class="menu">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      [class.active]="isActive(item.route)"
      class="menu-link"
      (click)="closeMenu()"
    >
      <span class="menu-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <div class="user-card">
      <div class="avatar">
        {{ user?.fullName?.charAt(0) || 'U' }}
      </div>

      <div class="user-info">
        <strong>{{ user?.fullName || 'Campus User' }}</strong>
        <span>{{ role || 'User' }}</span>
      </div>
    </div>

    <button
      class="logout-button"
      type="button"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</aside>
